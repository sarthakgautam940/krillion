<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lore Check</title>
  <meta name="description" content="A pass and play answer game about our friend group. Name it before the bar runs out.">
  <meta name="theme-color" content="#0b0e14">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="app" id="app">

    <main class="screen setup" id="setup">
      <header class="setup__head">
        <h1 class="wordmark">Lore Check</h1>
        <div class="meter" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="lede">Take turns naming answers before the bar runs out. Rarer answers score more.</p>
      </header>

      <div class="setup__grid">
        <section class="panel panel--players" aria-labelledby="playersTitle">
          <div class="panel__head">
            <h2 id="playersTitle">Players</h2>
            <span class="panel__note" id="playerCount"></span>
          </div>
          <ol class="roster" id="roster"></ol>
          <button class="btn btn--ghost" id="addPlayer" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Add player
          </button>
        </section>

        <section class="panel" aria-labelledby="gameTitle">
          <div class="panel__head"><h2 id="gameTitle">Game</h2></div>
          <div class="field">
            <span class="field__label" id="timerLabel">Turn timer</span>
            <div class="seg" role="radiogroup" aria-labelledby="timerLabel" data-setting="timer">
              <button type="button" role="radio" data-value="10">10s</button>
              <button type="button" role="radio" data-value="15">15s</button>
              <button type="button" role="radio" data-value="20">20s</button>
              <button type="button" role="radio" data-value="30">30s</button>
            </div>
          </div>
          <div class="field">
            <span class="field__label" id="heartsLabel">Hearts</span>
            <div class="seg" role="radiogroup" aria-labelledby="heartsLabel" data-setting="hearts">
              <button type="button" role="radio" data-value="1">1</button>
              <button type="button" role="radio" data-value="2">2</button>
              <button type="button" role="radio" data-value="3">3</button>
            </div>
          </div>
          <div class="field">
            <span class="field__label" id="orderLabel">Questions</span>
            <div class="seg" role="radiogroup" aria-labelledby="orderLabel" data-setting="order">
              <button type="button" role="radio" data-value="order">In order</button>
              <button type="button" role="radio" data-value="shuffle">Shuffled</button>
            </div>
          </div>
        </section>

        <section class="panel" aria-labelledby="pointsTitle">
          <div class="panel__head"><h2 id="pointsTitle">Points</h2></div>
          <ol class="ladder" id="ladder"></ol>
        </section>
      </div>

      <div class="setup__foot">
        <button class="btn btn--primary btn--xl" id="startBtn" type="button" disabled>Start game</button>
        <p class="status" id="bankStatus" role="status">Loading questions</p>
      </div>
    </main>

    <main class="screen play" id="play" hidden>
      <header class="topbar">
        <span class="wordmark wordmark--sm">Lore Check</span>
        <span class="topbar__progress" id="progress"></span>
        <div class="topbar__actions">
          <button class="icon-btn" id="soundBtn" type="button" aria-label="Sound" aria-pressed="true">
            <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
            <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
          </button>
          <button class="icon-btn" id="pauseBtn" type="button" aria-label="Pause">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>
          </button>
        </div>
      </header>

      <section class="stage" id="stage">
        <h2 class="question" id="question"></h2>

        <div class="timer" id="timer" data-state="blue">
          <div class="timer__track"><div class="timer__fill" id="timerFill"></div></div>
          <span class="timer__num" id="timerNum"></span>
        </div>

        <div class="turn" id="turn" aria-live="polite">
          <span class="avatar" id="turnAvatar"></span>
          <span class="turn__name" id="turnName"></span>
        </div>

        <form class="answer" id="answerForm" autocomplete="off">
          <label class="sr-only" for="answer">Your answer</label>
          <input class="answer__input" id="answer" type="text" maxlength="48" placeholder="Type an answer"
                 autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send">
          <button class="answer__send" type="submit" aria-label="Submit answer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
          </button>
          <div class="stamp" id="stamp" aria-hidden="true"></div>
        </form>

        <p class="feedback" id="feedback" role="status" aria-live="polite"></p>

        <ul class="board" id="board" aria-label="Answers found"></ul>
      </section>

      <footer class="players" id="players" aria-label="Players"></footer>
    </main>

    <main class="screen over" id="over" hidden>
      <div class="over__inner">
        <header class="over__head">
          <span class="avatar avatar--xl" id="winnerAvatar"></span>
          <h1 class="over__title" id="winnerTitle"></h1>
          <p class="over__score" id="winnerScore"></p>
        </header>
        <div class="table-wrap">
          <table class="results">
            <thead>
              <tr><th scope="col">Player</th><th scope="col">Best find</th><th scope="col" class="num">Answers</th><th scope="col" class="num">Score</th></tr>
            </thead>
            <tbody id="results"></tbody>
          </table>
        </div>
        <div class="over__actions">
          <button class="btn btn--primary btn--xl" id="againBtn" type="button">Play again</button>
          <button class="btn btn--ghost btn--xl" id="menuBtn" type="button">Change players</button>
        </div>
      </div>
    </main>
  </div>

  <div class="sheet" id="roundSheet" hidden>
    <div class="sheet__panel sheet__panel--wide" role="dialog" aria-modal="true" aria-labelledby="roundTitle">
      <h2 class="sheet__title" id="roundTitle"></h2>
      <p class="sheet__sub" id="roundReason"></p>
      <div class="reveal" id="reveal"></div>
      <div class="standings" id="standings"></div>
      <button class="btn btn--primary btn--xl" id="nextBtn" type="button"></button>
    </div>
  </div>

  <div class="sheet" id="pauseSheet" hidden>
    <div class="sheet__panel sheet__panel--small" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
      <h2 class="sheet__title" id="pauseTitle">Paused</h2>
      <div class="stack">
        <button class="btn btn--primary btn--xl" id="resumeBtn" type="button">Resume</button>
        <button class="btn btn--ghost btn--xl" id="skipBtn" type="button">Skip question</button>
        <button class="btn btn--ghost btn--xl" id="quitBtn" type="button">End game</button>
      </div>
    </div>
  </div>

  <div class="insane" id="insane" hidden>
    <div class="insane__bg"></div>
    <div class="insane__rays" aria-hidden="true"><svg id="insaneRays" viewBox="-100 -100 200 200"></svg></div>
    <div class="badge" id="insaneBadge" aria-hidden="true">
      <svg viewBox="-60 -60 120 120">
        <g class="badge__half badge__half--a"><path d="M0 -52 L0 52 L-52 0 Z"/></g>
        <g class="badge__half badge__half--b"><path d="M0 -52 L52 0 L0 52 Z"/></g>
        <g class="badge__mark"><rect x="-6" y="-30" width="12" height="38" rx="3"/><rect x="-6" y="15" width="12" height="12" rx="3"/></g>
      </svg>
    </div>
    <div class="insane__stage" role="dialog" aria-modal="true" aria-labelledby="insaneTitle">
      <h2 class="insane__title" id="insaneTitle" aria-label="Insane answer"></h2>
      <p class="insane__answer" id="insaneAnswer"></p>
      <p class="insane__meta"><span class="avatar" id="insaneAvatar"></span><span id="insaneBy"></span><span class="insane__pts" id="insanePts"></span></p>
      <button class="btn btn--light btn--xl insane__go" id="insaneGo" type="button">Continue</button>
    </div>
    <div class="insane__flash" id="insaneFlash"></div>
  </div>

  <canvas class="fx" id="fx" aria-hidden="true"></canvas>
</body>
</html>
